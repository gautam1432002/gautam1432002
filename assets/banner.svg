
<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Obsidian Background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <!-- Subtle Radial Glow Behind the Card -->
    <radialGradient id="ambientGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Minimalist Dot Grid Pattern -->
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.04"/>
    </pattern>

    <!-- Elegant Sweeping "Comet" Border Animation -->
    <linearGradient id="borderSweep" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="25%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#c084fc" stop-opacity="1"/>
      <stop offset="35%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
      <!-- Sweep Animation -->
      <animate attributeName="x1" values="-100%; 200%" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%; 400%" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>

    <!-- Text Shimmer Effect -->
    <linearGradient id="textShimmer" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#a5b4fc"/>
      <stop offset="75%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff"/>
      <animate attributeName="x1" values="-200%; 200%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%; 400%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Drop Shadow for Card Depth -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- 1. Background Layer -->
  <rect width="1200" height="320" fill="url(#bgGradient)"/>
  
  <!-- 2. Dot Grid Texture -->
  <rect width="1200" height="320" fill="url(#dotGrid)"/>

  <!-- 3. Ambient Center Glow -->
  <rect width="1200" height="320" fill="url(#ambientGlow)"/>

  <!-- Extremely Slow Drifting Dust Particles -->
  <g fill="#ffffff">
    <circle cx="150" cy="80" r="1"><animate attributeName="opacity" values="0;0.3;0" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="220" r="1.5"><animate attributeName="opacity" values="0;0.2;0" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="250" r="1"><animate attributeName="opacity" values="0;0.4;0" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="70" r="1"><animate attributeName="opacity" values="0;0.3;0" dur="10s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 4. The Glass Card -->
  <g transform="translate(120, 45)">
    <!-- Main Card Body with Shadow -->
    <rect width="960" height="230" rx="20" fill="url(#cardBg)" filter="url(#shadow)"/>
    
    <!-- Static Subtle Border -->
    <rect width="960" height="230" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    
    <!-- Animated "Comet" Light Border -->
    <rect width="960" height="230" rx="20" fill="none" stroke="url(#borderSweep)" stroke-width="1.5"/>

    <!-- Inner Top Light Reflection (Creates the Glass Edge Effect) -->
    <path d="M 24 1 L 936 1" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" fill="none"/>

    <!-- Top-Right Status Indicator -->
    <g transform="translate(850, 25)">
      <rect x="0" y="0" width="80" height="26" rx="13" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <!-- Pulsing Dot -->
      <circle cx="18" cy="13" r="3.5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="32" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#a1a1aa" letter-spacing="0.5">ONLINE</text>
    </g>

    <!-- 5. Typography -->
    <!-- Name -->
    <text x="480" y="105" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="url(#textShimmer)" letter-spacing="1.5">
      GAUTAM VERMA
    </text>

    <!-- Roles -->
    <text x="480" y="145" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#a1a1aa" letter-spacing="2">
      BACKEND DEVELOPER
      <tspan fill="#4f46e5" font-weight="400">  /  </tspan>
      FLUTTER ENGINEER
      <tspan fill="#4f46e5" font-weight="400">  /  </tspan>
      GENAI EXPLORER
    </text>

    <!-- Sleek Bottom Code Badge -->
    <g transform="translate(480, 185)">
      <!-- Badge Background -->
      <rect x="-95" y="-15" width="190" height="30" rx="15" fill="#09090b" stroke="#27272a" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#14b8a6" letter-spacing="0.5">
        ~ building_from_void
      </text>
    </g>
  </g>
</svg>
