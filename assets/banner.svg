
<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Obsidian Void Background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#020202"/>
    </linearGradient>

    <!-- Minimalist Grid Texture -->
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.04"/>
    </pattern>

    <!-- Frosted Glass Blur Filter -->
    <filter id="glass-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <!-- Brightens the blurred colors so they pop through the dark glass -->
      <feComponentTransfer>
        <feFuncA type="linear" slope="1.5"/>
      </feComponentTransfer>
    </filter>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <!-- Card Clip Path (Strictly masks the blur effect to the card's boundaries) -->
    <clipPath id="card-clip">
      <rect x="120" y="45" width="960" height="230" rx="20"/>
    </clipPath>

    <!-- Premium Text Shimmer Effect -->
    <linearGradient id="textShimmer" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#a5b4fc"/>
      <stop offset="75%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff"/>
      <animate attributeName="x1" values="-200%; 200%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%; 400%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- ========================================== -->
    <!-- MATH-SYNCED DVD BOUNCE ICONS ENGINE        -->
    <!-- Color changes exactly on wall collision    -->
    <!-- ========================================== -->
    <g id="all-icons">
      
      <!-- 1. AI Chip (Sync to X-wall hits) -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0; 1160,0; 0,0; 1160,0; 0,0" dur="32s" begin="-5s" repeatCount="indefinite"/>
        <g><animateTransform attributeName="transform" type="translate" values="0,0; 0,280; 0,0" dur="18s" begin="-5s" repeatCount="indefinite"/>
          <g transform="scale(1.6)" fill="currentColor">
            <animate attributeName="color" values="#ef4444; #3b82f6; #10b981; #eab308; #ef4444" keyTimes="0; 0.25; 0.5; 0.75; 1" calcMode="discrete" dur="32s" begin="-5s" repeatCount="indefinite"/>
            <path d="M20 9V7c0-1.1-.9-2-2-2h-2V3h-2v2h-4V3H8v2H6c-1.1 0-2 .9-2 2v2H2v2h2v4H2v2h2v2c0 1.1.9 2 2 2h2v2h2v-2h4v2h2v-2h2c1.1 0 2-.9 2-2v-2h2v-2h-2v-4h2V9z M18 19H6V7h12V19z"/><rect x="8" y="9" width="8" height="8"/>
          </g>
        </g>
      </g>

      <!-- 2. React (Sync to Y-wall hits) -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0; 1160,0; 0,0" dur="26s" begin="-12s" repeatCount="indefinite"/>
        <g><animateTransform attributeName="transform" type="translate" values="0,0; 0,280; 0,0; 0,280; 0,0" dur="44s" begin="-12s" repeatCount="indefinite"/>
          <g transform="scale(1.8)" fill="none" stroke="currentColor" stroke-width="2">
            <animate attributeName="color" values="#a855f7; #06b6d4; #ef4444; #3b82f6; #a855f7" keyTimes="0; 0.25; 0.5; 0.75; 1" calcMode="discrete" dur="44s" begin="-12s" repeatCount="indefinite"/>
            <ellipse cx="12" cy="12" rx="10" ry="4"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(120 12 12)"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/>
          </g>
        </g>
      </g>

      <!-- 3. Python (Sync to X-wall hits, reversed start) -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="1160,0; 0,0; 1160,0; 0,0; 1160,0" dur="40s" begin="-7s" repeatCount="indefinite"/>
        <g><animateTransform attributeName="transform" type="translate" values="280,0; 0,0; 280,0" dur="22s" begin="-7s" repeatCount="indefinite"/>
          <g transform="scale(1.6)" fill="currentColor">
            <animate attributeName="color" values="#10b981; #eab308; #a855f7; #06b6d4; #10b981" keyTimes="0; 0.25; 0.5; 0.75; 1" calcMode="discrete" dur="40s" begin="-7s" repeatCount="indefinite"/>
            <path d="M12 2c-5.5 0-5.5 2.2-5.5 2.2v2.2h5.5v.8H6.5c0 0-2.5 0-2.5 3.8s2.5 3.8 2.5 3.8h2v-2c0-1.2 1.2-1.2 1.2-1.2h3.8c1.2 0 1.2 1.2 1.2 1.2V6.5c0-4.5-2.7-4.5-2.7-4.5z M12 22c5.5 0 5.5-2.2 5.5-2.2v-2.2h-5.5v-.8h5.5c0 0 2.5 0 2.5-3.8s-2.5-3.8-2.5-3.8h-2v2c0 1.2-1.2 1.2-1.2 1.2H8.5c-1.2 0-1.2-1.2-1.2-1.2v-3.8c0-4.5 2.7-4.5 2.7-4.5z"/>
          </g>
        </g>
      </g>

      <!-- 4. Flutter (Sync to Y-wall hits) -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="1160,0; 0,0; 1160,0" dur="30s" begin="-15s" repeatCount="indefinite"/>
        <g><animateTransform attributeName="transform" type="translate" values="280,0; 0,0; 280,0; 0,0; 280,0" dur="48s" begin="-15s" repeatCount="indefinite"/>
          <g transform="scale(1.7)" fill="currentColor">
            <animate attributeName="color" values="#3b82f6; #10b981; #06b6d4; #eab308; #3b82f6" keyTimes="0; 0.25; 0.5; 0.75; 1" calcMode="discrete" dur="48s" begin="-15s" repeatCount="indefinite"/>
            <path d="M14.5 2L4 12.5l3.5 3.5L21.5 2zM12 15l-3 3 3 3h7l-6.5-6.5 6.5-6.5z"/>
          </g>
        </g>
      </g>

      <!-- 5. MySQL (Sync to X-wall hits) -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0; 1160,0; 0,0; 1160,0; 0,0" dur="36s" begin="-3s" repeatCount="indefinite"/>
        <g><animateTransform attributeName="transform" type="translate" values="0,0; 0,280; 0,0" dur="26s" begin="-3s" repeatCount="indefinite"/>
          <g transform="scale(1.5)" fill="currentColor">
            <animate attributeName="color" values="#ef4444; #a855f7; #10b981; #3b82f6; #ef4444" keyTimes="0; 0.25; 0.5; 0.75; 1" calcMode="discrete" dur="36s" begin="-3s" repeatCount="indefinite"/>
            <path d="M12 2C6.5 2 2 4.2 2 7v10c0 2.8 4.5 5 10 5s10-2.2 10-5V7c0-2.8-4.5-5-10-5zm0 2c4.4 0 8 1.8 8 3s-3.6 3-8 3-8-1.8-8-3 3.6-3 8-3zm0 16c-4.4 0-8-1.8-8-3v-1.7c1.8 1.4 4.7 2.2 8 2.2s6.2-.8 8-2.2V17c0 1.2-3.6 3-8 3z"/>
          </g>
        </g>
      </g>

      <!-- 6. Java (Sync to Y-wall hits) -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0; 1160,0; 0,0" dur="20s" begin="-9s" repeatCount="indefinite"/>
        <g><animateTransform attributeName="transform" type="translate" values="0,0; 0,280; 0,0; 0,280; 0,0" dur="40s" begin="-9s" repeatCount="indefinite"/>
          <g transform="scale(1.7)" fill="currentColor">
            <animate attributeName="color" values="#eab308; #ef4444; #06b6d4; #a855f7; #eab308" keyTimes="0; 0.25; 0.5; 0.75; 1" calcMode="discrete" dur="40s" begin="-9s" repeatCount="indefinite"/>
            <path d="M16 5c1 1 2 2 2 4M12 4c1 1 1.5 2.5 1.5 4.5M8 5c1 1 1.5 2 1.5 4M4 14.5C4 18 7.5 21 12 21c4.5 0 8-3 8-6.5V13H4v1.5z M20 13c1.5 0 2 1 2 2.5s-.5 2.5-2 2.5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          </g>
        </g>
      </g>

      <!-- 7. Spring Boot (Sync to X-wall hits) -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="1160,0; 0,0; 1160,0; 0,0; 1160,0" dur="44s" begin="-18s" repeatCount="indefinite"/>
        <g><animateTransform attributeName="transform" type="translate" values="280,0; 0,0; 280,0" dur="32s" begin="-18s" repeatCount="indefinite"/>
          <g transform="scale(1.8)" fill="currentColor">
            <animate attributeName="color" values="#10b981; #3b82f6; #eab308; #ef4444; #10b981" keyTimes="0; 0.25; 0.5; 0.75; 1" calcMode="discrete" dur="44s" begin="-18s" repeatCount="indefinite"/>
            <path d="M12 2C6.5 2 2 6.5 2 12c0 2 1 4.5 3 6.5 0 0 2-4 7-6 5-2 8.5-1 8.5-1C21 8 17 2 12 2z"/>
          </g>
        </g>
      </g>

      <!-- 8. Neural Network (Sync to Y-wall hits) -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="1160,0; 0,0; 1160,0" dur="34s" begin="-11s" repeatCount="indefinite"/>
        <g><animateTransform attributeName="transform" type="translate" values="280,0; 0,0; 280,0; 0,0; 280,0" dur="36s" begin="-11s" repeatCount="indefinite"/>
          <g transform="scale(1.7)" fill="currentColor">
            <animate attributeName="color" values="#06b6d4; #a855f7; #ef4444; #10b981; #06b6d4" keyTimes="0; 0.25; 0.5; 0.75; 1" calcMode="discrete" dur="36s" begin="-11s" repeatCount="indefinite"/>
            <circle cx="5" cy="7" r="2.5"/><circle cx="5" cy="17" r="2.5"/><circle cx="12" cy="12" r="3"/><circle cx="19" cy="7" r="2.5"/><circle cx="19" cy="17" r="2.5"/><path d="M6.8 7.9l4.4 3.2M6.8 16.1l4.4-3.2M13.8 11.1l4.4-3.2M13.8 12.9l4.4 3.2" stroke-width="2" stroke="currentColor" fill="none"/>
          </g>
        </g>
      </g>

      <!-- 9. TypeScript (Sync to X-wall hits) -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0; 1160,0; 0,0; 1160,0; 0,0" dur="48s" begin="-20s" repeatCount="indefinite"/>
        <g><animateTransform attributeName="transform" type="translate" values="0,0; 0,280; 0,0" dur="28s" begin="-20s" repeatCount="indefinite"/>
          <g transform="scale(1.5)" fill="currentColor">
            <animate attributeName="color" values="#3b82f6; #eab308; #10b981; #a855f7; #3b82f6" keyTimes="0; 0.25; 0.5; 0.75; 1" calcMode="discrete" dur="48s" begin="-20s" repeatCount="indefinite"/>
            <path d="M3 3v18h18V3H3zm12.5 14h-2v-4.5H11V11h4.5v6zm-5-1c-.5.8-1.2 1.2-2.2 1.2-1.5 0-2.5-1-2.5-2.5 0-1.8 1.5-2.2 3.2-2.2h1.2v-.8c0-1-.5-1.5-1.5-1.5-.8 0-1.5.3-2 .8l-1-1.5c.8-.8 2-1.2 3.5-1.2 2 0 3 1.2 3 3V16h-1.8v-1z"/>
          </g>
        </g>
      </g>

      <!-- 10. Android (Sync to Y-wall hits) -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0; 1160,0; 0,0" dur="24s" begin="-14s" repeatCount="indefinite"/>
        <g><animateTransform attributeName="transform" type="translate" values="0,0; 0,280; 0,0; 0,280; 0,0" dur="52s" begin="-14s" repeatCount="indefinite"/>
          <g transform="scale(1.7)" fill="currentColor">
            <animate attributeName="color" values="#10b981; #ef4444; #3b82f6; #a855f7; #10b981" keyTimes="0; 0.25; 0.5; 0.75; 1" calcMode="discrete" dur="52s" begin="-14s" repeatCount="indefinite"/>
            <path d="M17.5 9H6.5A5.5 5.5 0 0 0 1 14.5v1A1.5 1.5 0 0 0 2.5 17H21.5a1.5 1.5 0 0 0 1.5-1.5v-1A5.5 5.5 0 0 0 17.5 9z M6 6L7.5 8 M18 6L16.5 8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          </g>
        </g>
      </g>
      
      <!-- 11. Vite (Sync to X-wall hits) -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="1160,0; 0,0; 1160,0; 0,0; 1160,0" dur="28s" begin="-2s" repeatCount="indefinite"/>
        <g><animateTransform attributeName="transform" type="translate" values="0,0; 0,280; 0,0" dur="30s" begin="-2s" repeatCount="indefinite"/>
          <g transform="scale(1.6)" fill="currentColor">
            <animate attributeName="color" values="#a855f7; #eab308; #06b6d4; #ef4444; #a855f7" keyTimes="0; 0.25; 0.5; 0.75; 1" calcMode="discrete" dur="28s" begin="-2s" repeatCount="indefinite"/>
            <path d="M22 3l-9.5 18L3 6l6-4 3 6 4-3z"/>
          </g>
        </g>
      </g>

      <!-- 12. Django (Sync to Y-wall hits) -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="1160,0; 0,0; 1160,0" dur="38s" begin="-10s" repeatCount="indefinite"/>
        <g><animateTransform attributeName="transform" type="translate" values="280,0; 0,0; 280,0; 0,0; 280,0" dur="32s" begin="-10s" repeatCount="indefinite"/>
          <g transform="scale(1.7)" fill="currentColor">
            <animate attributeName="color" values="#06b6d4; #10b981; #ef4444; #eab308; #06b6d4" keyTimes="0; 0.25; 0.5; 0.75; 1" calcMode="discrete" dur="32s" begin="-10s" repeatCount="indefinite"/>
            <text x="12" y="17" font-family="system-ui, sans-serif" font-weight="900" font-size="16" text-anchor="middle">dj</text>
          </g>
        </g>
      </g>
    </g>
  </defs>

  <!-- ========================================== -->
  <!-- 1. BASE BACKGROUND                         -->
  <!-- ========================================== -->
  <rect width="1200" height="320" fill="url(#bgGradient)"/>
  <rect width="1200" height="320" fill="url(#dotGrid)"/>

  <!-- ========================================== -->
  <!-- 2. SHARP AMBIENT ICONS (Visible outside)   -->
  <!-- ========================================== -->
  <use href="#all-icons" opacity="0.3"/>

  <!-- ========================================== -->
  <!-- 3. THE GLASS SURFACE (Dark tinted pane)    -->
  <!-- ========================================== -->
  <rect x="120" y="45" width="960" height="230" rx="20" fill="#09090b" fill-opacity="0.45" filter="url(#shadow)"/>

  <!-- ========================================== -->
  <!-- 4. BLURRED REFLECTIONS (Inside glass only) -->
  <!-- ========================================== -->
  <!-- This duplicates the icons, heavily blurs them, and masks them exactly to the glass card. -->
  <use href="#all-icons" filter="url(#glass-blur)" clip-path="url(#card-clip)" opacity="1"/>

  <!-- ========================================== -->
  <!-- 5. GLASS BORDER & UI ELEMENTS              -->
  <!-- ========================================== -->
  <g transform="translate(120, 45)">
    <!-- Premium Glass Edge Highlight -->
    <rect width="960" height="230" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
    <path d="M 24 1 L 936 1" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" fill="none"/>

    <!-- Top-Right Status Indicator -->
    <g transform="translate(850, 25)">
      <rect x="0" y="0" width="80" height="26" rx="13" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <circle cx="18" cy="13" r="3.5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="32" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#a1a1aa" letter-spacing="0.5">ONLINE</text>
    </g>

    <!-- Typography -->
    <!-- Name -->
    <text x="480" y="105" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="url(#textShimmer)" letter-spacing="1.5">
      GAUTAM VERMA
    </text>

    <!-- Roles -->
    <text x="480" y="145" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#a1a1aa" letter-spacing="2">
      BACKEND DEVELOPER
      <tspan fill="#4f46e5" font-weight="400">  /  </tspan>
      FLUTTER ENGINEER
      <tspan fill="#4f46e5" font-weight="400">  /  </tspan>
      GENAI EXPLORER
    </text>

    <!-- Sleek Bottom Code Badge -->
    <g transform="translate(480, 185)">
      <rect x="-95" y="-15" width="190" height="30" rx="15" fill="#09090b" fill-opacity="0.85" stroke="#27272a" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#14b8a6" letter-spacing="0.5">
        ~ building_from_void
      </text>
    </g>
  </g>
</svg>
