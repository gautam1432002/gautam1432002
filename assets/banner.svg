<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050510"/>
      <stop offset="45%" stop-color="#0f0c29"/>
      <stop offset="100%" stop-color="#1a0f2e"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f7ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00f7ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff00e0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff00e0" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#00f7ff" stroke-width="0.6"/>
    </pattern>

    <filter id="neonGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f7ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f7ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00f7ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="1200" height="320" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" fill="url(#grid)" opacity="0.08">
    <animate attributeName="opacity" values="0.05;0.14;0.05" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- ambient nebula glows -->
  <circle cx="140" cy="60" r="180" fill="url(#glowCyan)">
    <animate attributeName="r" values="160;200;160" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="260" r="200" fill="url(#glowPink)">
    <animate attributeName="r" values="180;220;180" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- starfield -->
  <g fill="#ffffff">
    <circle cx="60" cy="40" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="130" cy="110" r="1"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.1s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="45" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="310" cy="150" r="1"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.6s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="70" r="1.3"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.2s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="220" r="1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="260" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.3s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="280" r="1.1"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="2.9s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="40" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="280" r="1"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.4s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="60" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="130" r="1.2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.7s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="40" r="1"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.9s" begin="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="220" r="1.4"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.2s" begin="0.7s" repeatCount="indefinite"/></circle>
  </g>

  <!-- corner HUD brackets (draw-in once) -->
  <g stroke="#00f7ff" stroke-width="2" fill="none" opacity="0.85">
    <path d="M20,20 L20,55 M20,20 L55,20" stroke-dasharray="70" stroke-dashoffset="70">
      <animate attributeName="stroke-dashoffset" from="70" to="0" dur="1.4s" fill="freeze"/>
    </path>
    <path d="M1180,20 L1180,55 M1180,20 L1145,20" stroke-dasharray="70" stroke-dashoffset="70">
      <animate attributeName="stroke-dashoffset" from="70" to="0" dur="1.4s" begin="0.15s" fill="freeze"/>
    </path>
    <path d="M20,300 L20,265 M20,300 L55,300" stroke-dasharray="70" stroke-dashoffset="70">
      <animate attributeName="stroke-dashoffset" from="70" to="0" dur="1.4s" begin="0.3s" fill="freeze"/>
    </path>
    <path d="M1180,300 L1180,265 M1180,300 L1145,300" stroke-dasharray="70" stroke-dashoffset="70">
      <animate attributeName="stroke-dashoffset" from="70" to="0" dur="1.4s" begin="0.45s" fill="freeze"/>
    </path>
  </g>

  <!-- orbit system, right side -->
  <g transform="translate(1010,160)">
    <circle r="26" fill="#00f7ff" filter="url(#softGlow)" opacity="0.9"/>
    <circle r="26" fill="#0f0c29" stroke="#00f7ff" stroke-width="1.5"/>
    <g>
      <ellipse rx="70" ry="20" fill="none" stroke="#ff00e0" stroke-width="1.4" opacity="0.75" transform="rotate(-18)"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse rx="95" ry="30" fill="none" stroke="#00f7ff" stroke-width="1" opacity="0.4" transform="rotate(-18)"/>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="22s" repeatCount="indefinite"/>
    </g>
    <circle r="3" fill="#ffffff">
      <animateMotion dur="8s" repeatCount="indefinite" path="M 70,0 A 70,20 0 1 1 -70,0 A 70,20 0 1 1 70,0"/>
    </circle>
  </g>

  <!-- scan line -->
  <rect x="0" y="0" width="1200" height="2.5" fill="url(#scanGrad)">
    <animate attributeName="y" values="0;318;0" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- status indicator -->
  <g transform="translate(1050,40)">
    <circle cx="0" cy="0" r="5" fill="#39ff14">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="14" y="4" font-family="Courier New, monospace" font-size="13" fill="#39ff14" letter-spacing="1">ONLINE</text>
  </g>

  <!-- title -->
  <text x="600" y="150" text-anchor="middle" font-family="Courier New, monospace" font-weight="bold"
        font-size="58" fill="#00f7ff" letter-spacing="6" filter="url(#neonGlow)">
    GAUTAM VERMA
    <animate attributeName="opacity" values="1;0.86;1;0.92;1" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- subtitle -->
  <text x="600" y="188" text-anchor="middle" font-family="Courier New, monospace"
        font-size="17" fill="#c9d1d9" letter-spacing="2" opacity="0.85">
    BACKEND DEVELOPER · FLUTTER ENGINEER · GENAI EXPLORER
  </text>

  <!-- divider tag -->
  <text x="600" y="220" text-anchor="middle" font-family="Courier New, monospace"
        font-size="13" fill="#ff00e0" letter-spacing="3" opacity="0.75">
    &lt; BUILDING FROM THE VOID /&gt;
  </text>
</svg>
